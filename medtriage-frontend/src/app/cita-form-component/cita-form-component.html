<section class="form-page">
  <div class="form-header">
    <p class="eyebrow">MEDTRIAGE</p>

    <h1>Registrar nueva cita</h1>

    <p>Escribe los datos necesarios para registrar la cita.</p>
  </div>

  <form #citaForm="ngForm" class="appointment-form" (ngSubmit)="guardarCita()">
    <div class="form-section">
      <h2>Asignación de la cita</h2>

      <div class="form-grid">
        <div class="field">
          <label for="pacienteId"> ID del paciente </label>

          <input
            id="pacienteId"
            name="pacienteId"
            type="number"
            min="1"
            placeholder="Ej. 1"
            [(ngModel)]="pacienteId"
            required
          />
        </div>

        <div class="field">
          <label for="doctorId"> ID del doctor </label>

          <input
            id="doctorId"
            name="doctorId"
            type="number"
            min="1"
            placeholder="Ej. 1"
            [(ngModel)]="doctorId"
            required
          />
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2>Información del triaje</h2>

      <div class="form-grid">
        <div class="field">
          <label for="nivelPrioridad"> Nivel de prioridad </label>

          <input
            id="nivelPrioridad"
            name="nivelPrioridad"
            type="text"
            placeholder="Ej. ALTA"
            [(ngModel)]="nivelPrioridad"
            required
          />
        </div>

        <div class="field">
          <label for="montoConsulta"> Monto de consulta </label>

          <input
            id="montoConsulta"
            name="montoConsulta"
            type="number"
            min="0"
            placeholder="Ej. 100000"
            [(ngModel)]="montoConsulta"
            required
          />
        </div>

        <div class="field full-width">
          <label for="motivoConsulta"> Motivo de la consulta </label>

          <textarea
            id="motivoConsulta"
            name="motivoConsulta"
            rows="5"
            placeholder="Describe el motivo de la consulta..."
            [(ngModel)]="motivoConsulta"
            required
          >
          </textarea>
        </div>
      </div>
    </div>

    <p class="error" *ngIf="error">
      {{ error }}
    </p>

    <div class="form-actions">
      <a routerLink="/citas" class="cancel-button"> Cancelar </a>

      <button type="submit" class="submit-button" [disabled]="citaForm.invalid || guardando">
        {{ guardando ? 'Guardando...' : 'Registrar cita' }}
      </button>
    </div>
  </form>
</section>
